name: stortrak

services:
  app:
    build:
      context: ./docker/app
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-stortrak}
      DB_USER: ${DB_USER:-stortrak}
      DB_PASSWORD: ${DB_PASSWORD:-stortrak}
      cfconfig_adminPassword: ${LUCEE_ADMIN_PASSWORD:-stortrak-admin}
    volumes:
      - ./:/app
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/index.cfm"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  db:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-stortrak-root}
      MYSQL_DATABASE: ${DB_NAME:-stortrak}
      MYSQL_USER: ${DB_USER:-stortrak}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stortrak}
      TZ: America/New_York
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./docker/db/stortrak-db.sh:/usr/local/bin/stortrak-db:ro
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Seed-data generator; not started by `up`. Run with `make seed`.
  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/seed/Dockerfile
    volumes:
      - ./seed:/app/seed:ro
      - ./db:/out

volumes:
  mysql-data:
